services:
  nats:
    image: nats:2.10
    command: --jetstream
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data

  clickhouse:
    image: clickhouse/clickhouse-server:24.1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  nats-data:
  clickhouse-data:
